# Central configuration. Edit this to match YOUR raw files; no code changes needed.

# =====================  FOLDERS  =====================
folder_input: "/work/solar-uv-data/input_data"  # the raw file is read from here
folder_output: "/work/solar-uv-data/products"   # notebooks go to <folder_output>/nbs, data to <folder_output>/data

# =====================  DATA SOURCE FOR some tasks  =====================
data_source: clean              # clean = cleaned data (output of `clean`) | load = raw data (output of `load`)
                                # With `load`, run `ploomber build --partially analyze` to skip `clean`.

# =====================  1. LOAD  =====================
load_config:
  raw_file: "rozhen.txt"
  
  delimiter: '\s+'              # exact field separator: ',' | ';' | '\t' | '\s+' (any whitespace)
  decimal: '.'                  # decimal mark: '.' or ','
  comment_char: '#'             # lines starting with this are skipped (null = none)
  has_header: true              # first line is a header; it is skipped, names come from `columns`

  # Exact column order in the file (one name per column). Output columns keep this order.
  columns: [unixtime, UVA, UVB, IR, SMP22]

  # Which column(s) hold the time, and how to read them:
  time_columns: [unixtime]      # one column, or several that are joined with a space, e.g. [date, time]
  time_format: unix_s           # unix_s | unix_ms | a strptime pattern such as '%Y-%m-%d %H:%M:%S'
  timezone: UTC                 # timezone of the file's times (ignored for unix); converted to UTC
  keep_raw_time: false          # true: also store the original time value(s) as column `time_raw`

# Main channel used by tasks (revised in the next steps).
value_column: UVB
value_units: "W/m^2"

# =====================  2. CLEAN  =====================
cadence: 1min                         # regular sampling interval (also used by `features`)

clean_config:                         # applied to the target channel = `value_column` (set above)
  sentinel_values: [-999, -9999, 9999]  # "missing" markers used by the instrument
  min_valid: 0.0                      # null = no lower limit
  max_valid: null                     # hard upper physical limit, null = none
  hampel_window: 11                   # samples, odd number; spike filter window
  hampel_sigmas: 6.0                  # larger = fewer points flagged as spikes
  hampel_floor_frac: 0.01             # noise floor for the spike test, as a fraction of the channel maximum
  max_gap_fill: 5                     # interpolate gaps of up to N samples; longer gaps stay empty

# =====================  3. PLOTS (interactive HTML page)  =====================
plots_config:
  title: "Solar UV measurements"
  channels: null                      # columns to plot; null = all columns from `load`
  panel_height: 200                   # height of each plot in pixels
  mask_sentinels: true                # hide the sentinel values (clean_config.sentinel_values) in the plots
  initial_days: null                  # width of the first view in days; null = whole record

# =====================  4. 3D SURFACES (interactive HTML page)  =====================
plots3d_config:
  title: "Solar UV measurements: daily 3D view"
  channels: null                      # columns to plot; null = all columns from `load`
  x_bin: 10min                        # time-of-day resolution (must divide a day: 1min, 5min, 10min, 15min, 30min, 1h)
  aggregate: mean                     # value per bin: mean | median | max | min  (median ignores isolated spikes)
  mask_sentinels: true                # hide the sentinel values (clean_config.sentinel_values)
  colorscale: Viridis                 # any Plotly colour scale name (Viridis, Turbo, Plasma, Cividis, ...)
  plot_height: 680                    # height of each plot in pixels
  aspect: [1.4, 2.0, 0.8]             # relative lengths of the time, date and value axes
  x_tick_hours: 3                     # label the time axis every N hours

