# Central configuration. Edit this to match YOUR raw files; no code changes needed.

# =====================  FOLDERS  =====================
folder_input: "/work/solar-uv-data/input_data"  # the raw file is read from here
folder_output: "/work/solar-uv-data/products"   # notebooks go to <folder_output>/nbs, data to <folder_output>/data

# =====================  DATA SOURCE FOR some tasks  =====================
data_source: load              # clean = cleaned data (output of `clean`) | load = raw data (output of `load`)
                                # With `load`, run `ploomber build --partially analyze` to skip `clean`.

# =====================  1. LOAD  =====================
load_config:
  raw_file: "rozhen.txt"
  
  delimiter: '\s+'              # exact field separator: ',' | ';' | '\t' | '\s+' (any whitespace)
  decimal: '.'                  # decimal mark: '.' or ','
  comment_char: '#'             # lines starting with this are skipped (null = none)
  has_header: true              # first line is a header; it is skipped, names come from `columns`

  # Exact column order in the file (one name per column). Output columns keep this order.
  columns: [unixtime, UVA, UVB, IR, SMP22]

  # Which column(s) hold the time, and how to read them:
  time_columns: [unixtime]      # one column, or several that are joined with a space, e.g. [date, time]
  time_format: unix_s           # unix_s | unix_ms | a strptime pattern such as '%Y-%m-%d %H:%M:%S'
  timezone: UTC                 # timezone of the file's times (ignored for unix); converted to UTC
  keep_raw_time: false          # true: also store the original time value(s) as column `time_raw`

# Main channel used by tasks (revised in the next steps).
value_column: UVB
value_units: "W/m^2"

# =====================  2. CLEAN  =====================
cadence: 1min                         # regular sampling interval (also used by `features`)

clean_config:                         # applied to the target channel = `value_column` (set above)
  sentinel_values: [-999, -9999, 9999]  # "missing" markers used by the instrument
  min_valid: 0.0                      # null = no lower limit
  max_valid: null                     # hard upper physical limit, null = none
  hampel_window: 11                   # samples, odd number; spike filter window
  hampel_sigmas: 6.0                  # larger = fewer points flagged as spikes
  hampel_floor_frac: 0.01             # noise floor for the spike test, as a fraction of the channel maximum
  max_gap_fill: 5                     # interpolate gaps of up to N samples; longer gaps stay empty

# =====================  3. PLOTS (interactive HTML page)  =====================
plots_config:
  title: "Solar UV measurements"
  channels: null                      # columns to plot; null = all columns from `load`
  panel_height: 200                   # height of each plot in pixels
  mask_sentinels: true                # hide the sentinel values (clean_config.sentinel_values) in the plots
  initial_days: null                  # width of the first view in days; null = whole record

# =====================  4. 3D SURFACES (interactive HTML page)  =====================
plots3d_config:
  title: "Solar UV measurements: daily 3D view"
  channels: null                      # columns to plot; null = all columns from `load`
  x_bin: 10min                        # time-of-day resolution (must divide a day: 1min, 5min, 10min, 15min, 30min, 1h)
  aggregate: mean                     # value per bin: mean | median | max | min  (median ignores isolated spikes)
  mask_sentinels: true                # hide the sentinel values (clean_config.sentinel_values)
  colorscale: Viridis                 # any Plotly colour scale name (Viridis, Turbo, Plasma, Cividis, ...)
  plot_height: 680                    # height of each plot in pixels
  aspect: [1.4, 2.0, 0.8]             # relative lengths of the time, date and value axes
  x_tick_hours: 3                     # label the time axis every N hours
  opacity: 1.0                        # 1 = solid; e.g. 0.8 = semi-transparent (can also be changed live on the page)
  opacityscale: null                  # value-dependent opacity, null = off. Preset: min | max | extremes | uniform,
                                      # or flat (position, opacity) pairs, e.g. [0, 0.0, 0.05, 0.25, 1, 1]
                                      # = lowest values invisible, fading in, highest values solid
                                      
# =====================  5-6. FEATURES / ANALYSIS  =====================
features_config:
  channels: null                      # columns to process; null = all columns of the source (with data_source: clean only the cleaned channel exists)
  mask_sentinels: true                # hide clean_config.sentinel_values before averaging (matters when data_source: load)

plots_features_config:
  title: "Solar UV measurements: daily features"
  channels: null                      # channels to plot; null = all channels present in the features output
  panel_height: 230                   # height of each of the 3 panels per channel, in pixels
  z_limit: 3.0                        # |z| above this marks an anomaly day in the plot (the flag itself is set in `features`)

# =====================  7. DAILY PARABOLA FITS  =====================
parabola_config:
  channels: null                      # columns to fit; null = all columns of the source (with data_source: clean only the cleaned channel exists)
  exclude_channels: [IR]              # columns never fitted (no useful daily shape); [] = none
  mask_sentinels: true                # hide clean_config.sentinel_values (matters when data_source: load)
  smooth_window: 11                   # samples; running median used to find the day's peak and the fitted part
  fit_fraction: 0.5                   # fit the part of the day above baseline + this fraction of (peak - baseline); 0 = whole daylight
  window_half_hours: null             # fixed fit interval = time of the peak +- this many hours (e.g. 3); null = choose by fit_fraction
  reject_sigma: 3.0                   # drop points this many noise units BELOW the parabola (clouds) and refit; null = plain fit
  dip_merge_minutes: 5               # dip samples closer than this (minutes) count as ONE dip; used for the dip statistics
  min_samples: 30                     # fewer samples in the day -> status no_data
  min_fit_hours: 2.0                  # shortest acceptable fitted window, hours
  max_gap_hours: 0.5                  # missing data longer than this inside the window -> status gap_in_window
  min_r2: 0.9                         # goodness of fit: an R^2 below this -> status very_cloudy
  low_peak_frac: 0.3                  # amplitude below this fraction of the typical clear-day amplitude -> status low_activity
  min_peak: null                      # optional absolute peak (data units) below which a day is low_activity
  # "perfect" parabolas = status ok AND all three of these (column <channel>_perfect):
  perfect_min_clear_fraction: 0.95    # at least this share of the points cloud-free
  perfect_min_r2: 0.99                # R^2 of the fit at least this
  perfect_max_rel_rmse: 0.02          # fit rmse / y_max at most this; null = not used

# =====================  7b. PARABOLA PLOTS (interactive HTML pages)  =====================
plots_parabola_config:
  title: "Solar UV: daily parabola fits"
  channels: null                      # channels to plot; null = all channels present in the parabola output
  columns: 4                          # plots per row at the start (can be changed on the page)
  grid_same_y_scale: true             # grid page: all plots of a channel share one vertical scale (switchable on the page)
  overlay_same_y_scale: false         # overlay page: same, default is a scale fitted to each day
  timeline_panel_height: 260          # timeline page: height of the plot of each channel, pixels
  timeline_initial_days: null         # timeline page: width of the first view in days; null = the whole record

# =====================  7c. DAILY MAXIMA BY PARABOLA QUALITY (HTML)  =====================
plots_max_config:
  title: "Solar UV: daily maxima by parabola quality"
  channels: null                      # channels to plot; null = all channels of the features output
  exclude_channels: [IR]              # channels left out of the page
  default_classes: [perfect, lightly_cloudy]   # quality classes switched on at the start (others can be enabled on the page)
  point_size: 7                       # marker size in pixels (also a slider on the page)
  lines: false                        # true = connect the visible points with lines at the start (check box on the page)
  panel_height: 260                   # height of the plot of each channel, pixels
  show_perfect: false               # true = also show, at the start, the same curve fitted only to the class `perfect` points (dashed; check box on the page)

min_daily_coverage: 0.6               # drop days with less data than this fraction
period_min_days: 5
period_max_days: 120
                                      