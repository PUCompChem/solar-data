meta:
  extract_upstream: false

tasks:
  - source: tasks/load.py
    name: load
    product:
      nb: "{{folder_output}}/nbs/load.ipynb"
      data: "{{folder_output}}/data/01_raw_combined.csv"
    params:
      folder_input: "{{folder_input}}"
      config: "{{load_config}}"

  - source: tasks/clean.py
    name: clean
    upstream: [load]
    product:
      nb: "{{folder_output}}/nbs/clean.ipynb"
      data: "{{folder_output}}/data/02_clean.csv"
      report: "{{folder_output}}/data/02_clean_report.csv"
    params:
      channel: "{{value_column}}"
      config: "{{clean_config}}"
      cadence: "{{cadence}}"

  - source: tasks/plots.py
    name: plots
    upstream: [load, clean]
    product:
      nb: "{{folder_output}}/nbs/plots.ipynb"
      html: "{{folder_output}}/plots/03_uv_plots.html"
    params:
      channel: "{{value_column}}"
      sentinel_values: "{{clean_config.sentinel_values}}"
      config: "{{plots_config}}"

  - source: tasks/plots3d.py
    name: plots3d
    upstream: [load]
    product:
      nb: "{{folder_output}}/nbs/plots3d.ipynb"
      html: "{{folder_output}}/plots/04_uv_surfaces.html"
    params:
      sentinel_values: "{{clean_config.sentinel_values}}"
      config: "{{plots3d_config}}"

  - source: tasks/features.py
    name: features
    upstream: ["{{data_source}}"]
    product:
      nb: "{{folder_output}}/nbs/features.ipynb"
      data: "{{folder_output}}/data/05_daily_features.csv"
    params:
      config: "{{features_config}}"
      sentinel_values: "{{clean_config.sentinel_values}}"
      cadence: "{{cadence}}"
      min_daily_coverage: "{{min_daily_coverage}}"

  - source: tasks/plots_features.py
    name: plots_features
    upstream: [features]
    product:
      nb: "{{folder_output}}/nbs/plots_features.ipynb"
      html: "{{folder_output}}/plots/05_features_plots.html"
    params:
      config: "{{plots_features_config}}"
      
  - source: tasks/analyze.py
    name: analyze
    upstream: ["{{data_source}}", features]
    product:
      nb: "{{folder_output}}/nbs/analyze.ipynb"
      summary: "{{folder_output}}/data/06_summary.json"
    params:
      value_column: "{{value_column}}"
      value_units: "{{value_units}}"
      period_min_days: "{{period_min_days}}"
      period_max_days: "{{period_max_days}}"